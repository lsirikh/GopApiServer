x-logging: &default-logging
  # v5.2 stability hotfix: 로그 회전 설정 (디스크 잠식 방지 + 죽음 증거 보존)
  # 10MB × 3 파일 = 서비스당 최대 30MB 보존, 호스트 C: 압박 해소
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: api-test-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gop}
      POSTGRES_USER: ${POSTGRES_USER:-gop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gop_pass}
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - api-test-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gop_user} -d ${POSTGRES_DB:-gop}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  api-server:
    container_name: api-test-server
    image: api-test-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # PRD v4.10 Phase 2: HTTPS 인증서 (mkcert 발급, certs/ 미존재 시 HTTP fallback)
      - ./certs:/app/certs:ro
    environment:
      - AUTH_MODE=${AUTH_MODE:-public}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS:-24}
      - DATABASE_URL=${API_DATABASE_URL:-postgresql://gop_user:gop_pass@postgres:5432/gop}
      - INIT_SAMPLE_DATA=${INIT_SAMPLE_DATA:-true}
      - SERVER_HOST=${SERVER_HOST:-0.0.0.0}
      - SERVER_PORT=${SERVER_PORT:-8000}
      - TZ=Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # v5.2 stability hotfix: 경량 health endpoint로 전환
      # 이전 /docs (3.6KB HTML) → /api/tracking/health (무인증, JSON 30B)
      # DB 블로킹 시 false-healthy 방지 + healthcheck 자체가 hot path에 부담 X
      test: ["CMD", "curl", "-fk", "https://localhost:8000/api/tracking/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging

  db-monitor:
    build:
      context: ./db_monitor
      dockerfile: Dockerfile
    container_name: api-test-db-monitor
    image: api-test-db-monitor:latest
    environment:
      - DATABASE_URL=${MONITOR_DATABASE_URL:-postgresql://gop_user:gop_pass@postgres:5432/gop}
      - NATS_URL=${NATS_URL:-nats://nats-server-01:4222}
      - UNIT_ID=${UNIT_ID:-unit001}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - nats_external
    logging: *default-logging

  gis-ingest:
    # 추적 이력 인제스트 워커: NATS sensorway.*.gis.tracking-status 구독 → track_points INSERT
    # PRD_Tracking_History_API.md §7 (db-monitor 역방향 미러)
    build:
      context: ./gis_ingest
      dockerfile: Dockerfile
    container_name: api-test-gis-ingest
    image: api-test-gis-ingest:latest
    environment:
      - DATABASE_URL=${MONITOR_DATABASE_URL:-postgresql://gop_user:gop_pass@postgres:5432/gop}
      - NATS_URL=${NATS_URL:-nats://nats-server-01:4222}
      - UNIT_ID=${UNIT_ID:-unit001}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - nats_external
    logging: *default-logging

  db-admin:
    container_name: api-test-db-admin
    image: adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    restart: unless-stopped
    logging: *default-logging

volumes:
  api-test-pgdata:

networks:
  default:
  nats_external:
    external: true
    name: nats-core_nats-network
