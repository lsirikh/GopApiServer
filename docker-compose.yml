services:
  postgres:
    image: postgres:16-alpine
    container_name: api-test-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gop}
      POSTGRES_USER: ${POSTGRES_USER:-gop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gop_pass}
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - api-test-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gop_user} -d ${POSTGRES_DB:-gop}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-server:
    container_name: api-test-server
    image: api-test-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # PRD v4.10 Phase 2: HTTPS 인증서 (mkcert 발급, certs/ 미존재 시 HTTP fallback)
      - ./certs:/app/certs:ro
    environment:
      - AUTH_MODE=${AUTH_MODE:-public}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS:-24}
      - DATABASE_URL=${API_DATABASE_URL:-postgresql://gop_user:gop_pass@postgres:5432/gop}
      - INIT_SAMPLE_DATA=${INIT_SAMPLE_DATA:-true}
      - SERVER_HOST=${SERVER_HOST:-0.0.0.0}
      - SERVER_PORT=${SERVER_PORT:-8000}
      - TZ=Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # PRD v4.10 Phase 2: HTTPS healthcheck (자체 서명이므로 -k 옵션 — 컨테이너 내부엔 mkcert CA 미신뢰)
      test: ["CMD", "curl", "-fk", "https://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db-monitor:
    build:
      context: ./db_monitor
      dockerfile: Dockerfile
    container_name: api-test-db-monitor
    image: api-test-db-monitor:latest
    environment:
      - DATABASE_URL=${MONITOR_DATABASE_URL:-postgresql://gop_user:gop_pass@postgres:5432/gop}
      - NATS_URL=${NATS_URL:-nats://nats-server-01:4222}
      - UNIT_ID=${UNIT_ID:-unit001}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - nats_external

  db-admin:
    container_name: api-test-db-admin
    image: adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  api-test-pgdata:

networks:
  default:
  nats_external:
    external: true
    name: nats-core_nats-network
