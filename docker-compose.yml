services:
  postgres:
    image: postgres:16-alpine
    container_name: gop-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gop}
      POSTGRES_USER: ${POSTGRES_USER:-gop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gop_pass}
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gop_user} -d ${POSTGRES_DB:-gop}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api_server-fastapi:
    container_name: api_server-fastapi
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - AUTH_MODE=${AUTH_MODE:-public}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS:-24}
      - DATABASE_URL=${API_DATABASE_URL:-postgresql://gop_user:gop_pass@postgres:5432/gop}
      - INIT_SAMPLE_DATA=${INIT_SAMPLE_DATA:-true}
      - SERVER_HOST=${SERVER_HOST:-0.0.0.0}
      - SERVER_PORT=${SERVER_PORT:-8000}
      - TZ=Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db-monitor:
    build:
      context: ./db_monitor
      dockerfile: Dockerfile
    container_name: gop-db-monitor
    environment:
      - DATABASE_URL=${MONITOR_DATABASE_URL:-postgresql://gop_user:gop_pass@postgres:5432/gop}
      - NATS_URL=${NATS_URL:-nats://localhost:4222}
      - UNIT_ID=${UNIT_ID:-unit001}
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  db-admin:
    container_name: db-admin
    image: adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
